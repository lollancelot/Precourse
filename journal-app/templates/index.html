<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Journal"/>
  <meta name="theme-color" content="#7c6af7"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <link rel="apple-touch-icon" href="/static/icon-192.svg"/>
  <title>AI Journal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #7c6af7;
      --accent-soft: #3d3570;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --mood-1: #f97316;
      --mood-2: #eab308;
      --mood-3: #22c55e;
      --mood-4: #3b82f6;
      --mood-5: #a855f7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      padding: calc(var(--safe-top) + 16px) 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header h1 span { color: var(--accent); }

    .btn-icon {
      background: var(--surface2);
      border: none;
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }
    .btn-icon:active { background: var(--accent-soft); }

    /* Views */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* Entry list */
    .entry-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .empty-state .emoji { font-size: 56px; }
    .empty-state p { font-size: 15px; line-height: 1.5; }

    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
    }
    .entry-card:active { transform: scale(0.98); border-color: var(--accent); }

    .entry-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .entry-card h3 {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
      line-height: 1.3;
    }

    .mood-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .entry-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .entry-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .entry-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .ai-badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124, 106, 247, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 20;
    }
    .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(124,106,247,0.4); }

    /* New entry view */
    .new-entry-form {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

    textarea {
      min-height: 180px;
      resize: none;
      line-height: 1.6;
    }

    .mood-row {
      display: flex;
      gap: 10px;
    }

    .mood-btn {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s;
    }
    .mood-btn .emoji { font-size: 22px; }
    .mood-btn .label { font-size: 10px; color: var(--text-muted); }
    .mood-btn.selected { border-color: var(--accent); background: var(--accent-soft); }

    .api-key-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .api-key-row summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .api-key-row input { margin-top: 10px; }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: calc(var(--safe-bottom) + 16px);
    }
    .btn-primary:active { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; }

    /* Detail view */
    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .detail-body {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }

    .ai-response {
      background: var(--surface);
      border: 1px solid var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
    }

    .ai-response .ai-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .ai-response p {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .btn-delete {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-bottom: calc(var(--safe-bottom) + 16px);
    }
    .btn-delete:active { background: rgba(239,68,68,0.1); }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 90px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- LIST VIEW -->
  <div class="view active" id="view-list">
    <div class="header">
      <h1>My <span>Journal</span></h1>
      <button class="btn-icon" id="btn-settings" title="Settings">⚙️</button>
    </div>
    <div class="entry-list" id="entry-list">
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="emoji">📓</div>
        <p>No entries yet.<br/>Tap <strong>+</strong> to write your first one.</p>
      </div>
    </div>
    <button class="fab" id="fab">+</button>
  </div>

  <!-- NEW ENTRY VIEW -->
  <div class="view" id="view-new">
    <div class="header">
      <button class="btn-icon" id="btn-back-new">←</button>
      <h1>New <span>Entry</span></h1>
      <div style="width:40px"></div>
    </div>
    <div class="new-entry-form">
      <div>
        <label for="entry-title">Title</label>
        <input type="text" id="entry-title" placeholder="What's this entry about?"/>
      </div>
      <div>
        <label>Mood</label>
        <div class="mood-row" id="mood-row">
          <button class="mood-btn" data-mood="awful"><span class="emoji">😞</span><span class="label">Awful</span></button>
          <button class="mood-btn" data-mood="bad"><span class="emoji">😕</span><span class="label">Bad</span></button>
          <button class="mood-btn" data-mood="okay"><span class="emoji">😐</span><span class="label">Okay</span></button>
          <button class="mood-btn" data-mood="good"><span class="emoji">🙂</span><span class="label">Good</span></button>
          <button class="mood-btn" data-mood="great"><span class="emoji">😄</span><span class="label">Great</span></button>
        </div>
      </div>
      <div>
        <label for="entry-body">Write freely...</label>
        <textarea id="entry-body" placeholder="What's on your mind today?"></textarea>
      </div>
      <details class="api-key-row" id="api-key-section">
        <summary>✨ Enable AI feedback (optional)</summary>
        <input type="text" id="api-key-input" placeholder="sk-ant-...  (Anthropic API key)" autocomplete="off"/>
      </details>
      <button class="btn-primary" id="btn-save">Save Entry</button>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="view" id="view-detail">
    <div class="header">
      <button class="btn-icon" id="btn-back-detail">←</button>
      <h1><span>Entry</span></h1>
      <div style="width:40px"></div>
    </div>
    <div class="detail-scroll">
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-body" id="detail-body"></div>
      <div class="ai-response" id="detail-ai" style="display:none">
        <div class="ai-label">✨ Claude's reflection</div>
        <p id="detail-ai-text"></p>
      </div>
      <button class="btn-delete" id="btn-delete">Delete Entry</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const MOODS = {
  awful: { color: "#ef4444", emoji: "😞" },
  bad:   { color: "#f97316", emoji: "😕" },
  okay:  { color: "#eab308", emoji: "😐" },
  good:  { color: "#22c55e", emoji: "🙂" },
  great: { color: "#a855f7", emoji: "😄" },
};

let entries = [];
let selectedMood = "";
let currentEntry = null;

// --- Views ---
function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelector(".fab").style.display = id === "view-list" ? "flex" : "none";
}

// --- Toast ---
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// --- Load entries ---
async function loadEntries() {
  const res = await fetch("/api/entries");
  entries = await res.json();
  renderList();
}

function renderList() {
  const list = document.getElementById("entry-list");
  const empty = document.getElementById("empty-state");
  list.querySelectorAll(".entry-card").forEach(e => e.remove());

  if (entries.length === 0) {
    empty.style.display = "flex";
    return;
  }
  empty.style.display = "none";

  entries.forEach(entry => {
    const card = document.createElement("div");
    card.className = "entry-card";
    const mood = MOODS[entry.mood] || {};
    const date = new Date(entry.created_at + "Z");
    const dateStr = date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

    card.innerHTML = `
      <div class="entry-card-top">
        <h3>${escHtml(entry.title)}</h3>
        ${entry.mood ? `<div class="mood-dot" style="background:${mood.color}"></div>` : ""}
      </div>
      <p>${escHtml(entry.body)}</p>
      <div class="entry-card-meta">
        <span class="entry-date">${dateStr}</span>
        ${entry.ai_feedback ? '<span class="ai-badge">✨ AI</span>' : ""}
      </div>
    `;
    card.addEventListener("click", () => openDetail(entry));
    list.appendChild(card);
  });
}

// --- Detail view ---
function openDetail(entry) {
  currentEntry = entry;
  const mood = MOODS[entry.mood] || {};
  const date = new Date(entry.created_at + "Z");
  const dateStr = date.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

  document.getElementById("detail-title").textContent = entry.title;
  document.getElementById("detail-body").textContent = entry.body;
  document.getElementById("detail-meta").innerHTML = `
    <span>${dateStr}</span>
    ${entry.mood ? `<span>${mood.emoji} ${entry.mood.charAt(0).toUpperCase()+entry.mood.slice(1)}</span>` : ""}
  `;

  const aiSection = document.getElementById("detail-ai");
  if (entry.ai_feedback) {
    document.getElementById("detail-ai-text").textContent = entry.ai_feedback;
    aiSection.style.display = "block";
  } else {
    aiSection.style.display = "none";
  }

  showView("view-detail");
}

// --- Delete ---
document.getElementById("btn-delete").addEventListener("click", async () => {
  if (!currentEntry) return;
  await fetch(`/api/entries/${currentEntry.id}`, { method: "DELETE" });
  toast("Entry deleted");
  await loadEntries();
  showView("view-list");
});

// --- New entry ---
document.getElementById("fab").addEventListener("click", () => {
  document.getElementById("entry-title").value = "";
  document.getElementById("entry-body").value = "";
  selectedMood = "";
  document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("selected"));
  showView("view-new");
});

document.querySelectorAll(".mood-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedMood = btn.dataset.mood;
    document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  });
});

document.getElementById("btn-save").addEventListener("click", async () => {
  const title = document.getElementById("entry-title").value.trim();
  const body = document.getElementById("entry-body").value.trim();
  const apiKey = document.getElementById("api-key-input").value.trim();

  if (!title) { toast("Please add a title"); return; }
  if (!body) { toast("Please write something"); return; }

  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.innerHTML = apiKey
    ? '<span class="spinner"></span>Getting AI feedback...'
    : "Saving...";

  try {
    const res = await fetch("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, body, mood: selectedMood, apiKey })
    });
    const entry = await res.json();
    if (!res.ok) throw new Error(entry.error);
    toast(entry.ai_feedback ? "Saved with AI feedback ✨" : "Entry saved!");
    await loadEntries();
    showView("view-list");
  } catch (e) {
    toast("Error saving: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Entry";
  }
});

// --- Navigation ---
document.getElementById("btn-back-new").addEventListener("click", () => showView("view-list"));
document.getElementById("btn-back-detail").addEventListener("click", () => showView("view-list"));

// --- Service worker ---
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js");
}

// --- Helpers ---
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// --- Init ---
loadEntries();
</script>
</body>
</html>
